name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"
  REGISTRY: "{{DOCKER_REGISTRY}}"
  APP_NAME: "{{APP_NAME}}"

jobs:
  # ============================================================================
  # Lint and Test
  # ============================================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Materialize template tokens
        run: |
          git grep -l -e '{{APP_NAME}}' -e '{{APP_TITLE}}' -e '{{GITHUB_ORG}}' \
            | xargs -r sed -i \
              -e 's/{{APP_NAME}}/discord-bot-template/g' \
              -e 's/{{APP_TITLE}}/Discord Bot Template/g' \
              -e 's/{{GITHUB_ORG}}/FutureHax/g'

      - name: Install dependencies
        run: |
          npm install
          cd commons && npm install
          cd ../api-service && npm install
          cd ../dashboard && npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Type check (Dashboard)
        run: cd dashboard && npm run type-check

      - name: Run tests
        run: npm run test

  # ============================================================================
  # Build Docker Images
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push images
        uses: docker/bake-action@v6
        with:
          push: true
          set: |
            *.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:cache
            *.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.APP_NAME }}:cache,mode=max
            bot.tags=${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ steps.version.outputs.sha_short }}
            bot.tags=${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest
            api.tags=${{ env.REGISTRY }}/${{ env.APP_NAME }}-api:${{ steps.version.outputs.sha_short }}
            api.tags=${{ env.REGISTRY }}/${{ env.APP_NAME }}-api:latest
            dashboard.tags=${{ env.REGISTRY }}/${{ env.APP_NAME }}-dashboard:${{ steps.version.outputs.sha_short }}
            dashboard.tags=${{ env.REGISTRY }}/${{ env.APP_NAME }}-dashboard:latest

  # ============================================================================
  # Semantic Release
  # ============================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Materialize template tokens
        run: |
          git grep -l -e '{{APP_NAME}}' -e '{{APP_TITLE}}' -e '{{GITHUB_ORG}}' \
            | xargs -r sed -i \
              -e 's/{{APP_NAME}}/discord-bot-template/g' \
              -e 's/{{APP_TITLE}}/Discord Bot Template/g' \
              -e 's/{{GITHUB_ORG}}/FutureHax/g'

      - name: Install dependencies
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Semantic Release
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_REGISTRY: ${{ env.REGISTRY }}
          APP_NAME: ${{ env.APP_NAME }}
        run: npx semantic-release

  # ============================================================================
  # Helm Lint
  # ============================================================================
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize template tokens
        run: |
          git grep -l -e '{{APP_NAME}}' -e '{{APP_TITLE}}' -e '{{GITHUB_ORG}}' \
            | xargs -r sed -i \
              -e 's/{{APP_NAME}}/discord-bot-template/g' \
              -e 's/{{APP_TITLE}}/Discord Bot Template/g' \
              -e 's/{{GITHUB_ORG}}/FutureHax/g'

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          cd chart/${{ env.APP_NAME }}
          helm dependency update
          helm lint . -f base/values.yaml